spring:
  application:
    name: logguard-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/logguard}
    username: ${SPRING_DATASOURCE_USERNAME:logguard}
    password: ${SPRING_DATASOURCE_PASSWORD:logguard123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:logguard-secret-key-must-be-at-least-32-chars!!}
  expiration-ms: 86400000

ai:
  engine:
    url: ${AI_ENGINE_URL:http://localhost:5000}

jenkins:
  url: ${JENKINS_URL:http://localhost:8090}
  admin:
    user:  ${JENKINS_ADMIN_USER:admin}
    token: ${JENKINS_ADMIN_TOKEN:admin123}

logguard:
  service:
    token: ${LOGGUARD_SERVICE_TOKEN:logguard-internal-svc-2024}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: never